<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounded Box</title>
    <style>
        body {
            display: flex; /* Use flexbox for centering */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            min-height: 100vh; /* Ensure full viewport height */
            margin: 0; /* Remove default body margin */
            background-color: #f0f0f0; /* Optional: Light grey background for the page */
        }

        .rounded-box {
            background-color: lightblue;
            border-radius: 5%; /* 5% rounded corners */
            padding: 20px; /* Add some padding inside the box */
            width: 600px; /* Set a width for the box */
            height: 600px; /* Set a height for the box */
            text-align: center; /* Center the text inside the box*/
        }
    </style>
</head>
<body>
    <div class="rounded-box">
        This is a rounded box!
    </div>
</body>
</html>
